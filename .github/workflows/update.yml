name: Update listings

on:
  schedule:
    - cron: "23 6,17 * * *"   # twice a day, early morning and early evening UK time
  workflow_dispatch:           # adds a "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Rightmove for new houses
        run: node update.mjs
        continue-on-error: true
      - name: Save the updated list
        run: |
          git config user.name "house-map-bot"
          git config user.email "house-map-bot@users.noreply.github.com"
          git add listings.json
          git diff --cached --quiet || (git commit -m "Update listings" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
